<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gye Nyame Hot Kenkey | Premium Ghana Food</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
}

/* HEADER */
header{
    background:linear-gradient(90deg,#000,#b8860b);
    padding:20px;
    text-align:center;
}

header h1{
    color:#ffd700;
    font-size:35px;
}

header p{
    margin-top:10px;
}


/* NAVIGATION */
nav{
    display:flex;
    justify-content:center;
    gap:20px;
    background:#111;
    padding:15px;
}

nav a{
    color:#ffd700;
    text-decoration:none;
    font-weight:bold;
}


/* HERO */
.hero{
    min-height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;

    background:
    linear-gradient(
    rgba(0,0,0,.6),
    rgba(0,0,0,.8)),
    url("https://images.unsplash.com/photo-1601050690597-df0568f70950");
    
    background-size:cover;
    background-position:center;
}


.hero h2{
    font-size:45px;
    color:#ffd700;
}


.hero button{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#ffd700;
    color:black;
    font-size:18px;
    cursor:pointer;
}


/* SECTIONS */

section{
    padding:40px 20px;
}


.title{
    text-align:center;
    color:#ffd700;
    font-size:32px;
    margin-bottom:30px;
}


/* MENU */

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}


.card{
    background:#171717;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 20px #000;
}


.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:15px;
}


.card h3{
    color:#ffd700;
    margin:15px;
}


.card button{
    background:#ffd700;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:20px;
}



/* ORDER */

.order-box{

background:#171717;
padding:30px;
border-radius:20px;
max-width:600px;
margin:auto;

}


input,select,textarea{

width:100%;
padding:15px;
margin:10px 0;
border-radius:10px;
border:none;

}


.order-btn{

width:100%;
background:#25D366;
color:white;
padding:15px;
border:none;
border-radius:30px;
font-size:18px;

}



/* LOCATION */

.location{

background:#111;
text-align:center;

}


.location h2{

color:#ffd700;

}


.location a{

display:inline-block;
margin-top:20px;
background:#ffd700;
padding:15px;
color:black;
text-decoration:none;
border-radius:20px;

}



/* AI BUTTON */

.ai{

position:fixed;
bottom:25px;
right:25px;

background:#ffd700;
color:black;

width:60px;
height:60px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;

box-shadow:0 0 20px gold;

}



/* WHATSAPP */

.whatsapp{

position:fixed;
bottom:25px;
left:25px;

background:#25D366;

width:60px;
height:60px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;

}


footer{

background:#000;
padding:30px;
text-align:center;
color:#ffd700;

}



/* PHONE */

@media(max-width:600px){

header h1{

font-size:25px;

}


.hero h2{

font-size:30px;

}


nav{

flex-direction:column;

}


}

</style>

</head>


<body>


<header>

<h1>GYE NYAME HOT KENKEY</h1>

<p>Premium Ghanaian Kenkey • Fresh • Delicious • Trusted</p>

</header>


<nav>

<a href="#menu">Menu</a>
<a href="#order">Order</a>
<a href="#location">Location</a>

</nav>
