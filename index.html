<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mensah Prosper | Developer Portfolio</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
scroll-behavior:smooth;
}


:root{

--main:#007bff;
--dark:#111;
--card:#ffffff;
--text:#222;

}


body{

background:#f4f4f4;
color:var(--text);
transition:.4s;

}


body.dark{

background:#111;
color:white;

}


header{

position:sticky;
top:0;
z-index:999;

display:flex;
justify-content:space-between;
align-items:center;

padding:20px 8%;

background:#111;
color:white;

}


.logo{

font-size:25px;
font-weight:bold;

}


nav a{

color:white;
text-decoration:none;
margin:12px;

}


nav a:hover{

color:#00ffff;

}


.toggle{

cursor:pointer;
font-size:22px;

}




.hero{

min-height:90vh;

display:flex;

align-items:center;
justify-content:space-around;

padding:50px 8%;

flex-wrap:wrap;

}



.hero h1{

font-size:55px;

}


.hero span{

color:var(--main);

}


.hero p{

font-size:20px;
margin:20px 0;

}



.btn{

display:inline-block;

background:var(--main);

color:white;

padding:15px 30px;

border-radius:30px;

text-decoration:none;

border:none;

cursor:pointer;

}



.profile{

width:280px;
height:280px;

border-radius:50%;

background:#ddd;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

}


.profile img{

width:100%;
height:100%;

object-fit:cover;

}





section{

padding:70px 8%;

text-align:center;

}



.title{

font-size:35px;

margin-bottom:30px;

}



.cards{

display:flex;

justify-content:center;

gap:25px;

flex-wrap:wrap;

}



.card{

background:var(--card);

padding:30px;

width:270px;

border-radius:20px;

box-shadow:0 10px 25px #0002;

transition:.3s;

}



body.dark .card{

background:#222;

}



.card:hover{

transform:translateY(-10px);

}




.skill{

margin:20px auto;

max-width:500px;

text-align:left;

}



.bar{

background:#ccc;

height:15px;

border-radius:20px;

}



.progress{

height:100%;

background:var(--main);

border-radius:20px;

}




input,textarea{

width:100%;

padding:15px;

margin:10px;

border-radius:10px;

border:1px solid #aaa;

}



textarea{

height:120px;

}




footer{

background:#111;

color:white;

padding:30px;

text-align:center;

}





.chat{

position:fixed;

bottom:20px;

right:20px;

background:var(--main);

color:white;

padding:20px;

border-radius:50%;

cursor:pointer;

font-size:25px;

}




#bot{

display:none;

position:fixed;

bottom:90px;

right:20px;

width:300px;

background:white;

color:black;

padding:20px;

border-radius:20px;

box-shadow:0 10px 30px #0005;

}



body.dark #bot{

background:#222;

color:white;

}



@media(max-width:700px){


header{

flex-direction:column;

}


.hero h1{

font-size:35px;

}


nav{

margin-top:15px;

}


}


</style>


</head>


<body>


<header>


<div class="logo">
Mensah Prosper
</div>


<nav>

<a href="#home">Home</a>

<a href="#about">About</a>

<a href="#skills">Skills</a>

<a href="#projects">Projects</a>

<a href="#business">Business</a>

<a href="#contact">Contact</a>


<span class="toggle" onclick="darkMode()">
🌙
</span>


</nav>


</header>



<section class="hero" id="home">


<div>


<h1>
Hello, I'm <span>Mensah Prosper</span>
</h1>


<p>
IT Student | Web Developer | Future Tech Entrepreneur
</p>


<a class="btn" href="#contact">
Hire Me
</a>


<a class="btn" href="#">
Download CV
</a>


</div>



<div class="profile">

<img src="your-image.jpg">

</div>


</section>
